name: build-app
run-name: ${{ github.actor }} fait des trucs
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # - name: Github Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        run: docker tag tp2-connect:v0.1 ghcr.io/${{ github.repository }}/tp2-connect:v0.1

      - name: Authentification
        run: docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}/tp2-connect:v0.1 .

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}/tp2-connect:v0.1
      # - run: docker compose build tp2-connect